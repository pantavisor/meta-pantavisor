# Pantavisor mounts /storage before it can load modules, and modules.squashfs
# itself lives there, so everything on the path to the NVMe root is built in.
CONFIG_NVME_CORE=y
CONFIG_BLK_DEV_NVME=y
CONFIG_EXT4_FS=y
# Stock containers request no network driver, so the RJ-45 port is built in
# to reach the Hub without one.
CONFIG_R8127=y
# The sdboot backend rewrites the ESP and the systemd-boot EFI variables.
CONFIG_VFAT_FS=y
CONFIG_EFIVAR_FS=y
# vfat's default iocharset; as a module the ESP mount would need modprobe.
CONFIG_NLS_ISO8859_1=y

# The Tegra CBB error driver binds to GB10's T254 fabrics over ACPI and
# corrupts memory; DGX OS also blacklists its initcall on the cmdline.
# CONFIG_SOC_TEGRA_CBB is not set

# Ubuntu points these at Canonical certificates under debian/, which the
# source tarball does not carry.
CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_REVOCATION_KEYS=""
# Yocto strips modules after install, which would break the signatures.
# CONFIG_MODULE_SIG is not set
# CONFIG_MODULE_COMPRESS is not set

# BTF needs pahole-native; DWARF only bloats the build.
# CONFIG_DEBUG_INFO_BTF is not set
# CONFIG_DEBUG_INFO_DWARF5 is not set
CONFIG_DEBUG_INFO_NONE=y
