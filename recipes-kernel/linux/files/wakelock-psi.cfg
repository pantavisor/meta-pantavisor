#
# PSI (pressure stall information) for the wakelock cadence quiescence
# detector, which reads per-cgroup cpu.pressure to tell a container that is
# genuinely idle from one that is runnable but starved of CPU, and closes a
# wake window early only for the former.
#
# Optional: the detector falls back to /proc/pressure/cpu and then to
# cpu.stat usage alone when PSI is absent, so cadence still works without
# this -- it just loses the stall veto. Hence a separate opt-in fragment
# rather than a line in the common wakelock.cfg: PSI accounting is always-on
# once compiled in, and there is no reason to charge that to devices which
# never enable cadence.
#
CONFIG_PSI=y
