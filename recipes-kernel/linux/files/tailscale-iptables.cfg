# --- iptables-legacy Specific Configuration for Tailscale ---
# For iptables-legacy, the MARK target is provided by xt_MARK
CONFIG_NETFILTER_XT_MATCH_MARK=y
CONFIG_NETFILTER_XT_TARGET_MARK=y

# --- Common Tailscale Dependencies (regardless of firewall backend) ---
CONFIG_NETFILTER=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_CONNTRACK_IPV4=y
CONFIG_NF_CONNTRACK_IPV6=y
CONFIG_NF_NAT=y
CONFIG_NF_NAT_IPV4=y
CONFIG_NF_NAT_IPV6=y
CONFIG_TUN=y
CONFIG_WIREGUARD=y
CONFIG_IPV6=y
CONFIG_IPV6_ROUTER_PREF=y
CONFIG_IPV6_ROUTE_INFO=y
CONFIG_IPV6_MIP6=y
CONFIG_IPV6_MULTIPLE_TABLES=y

# --- iptables-nft backend used by the pv-tailscale container ---
# pv-tailscale ships Alpine's iptables, which is xtables-nft-multi, whatever the
# host image installs. Built in rather than =m: nothing loads these modules on
# demand for a container, and tailscaled exits on "could not get iptables
# version" when nf_tables is missing.
# The xt_* options are the matches/targets tailscaled's rules use via nft_compat.
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_COMPAT=y
CONFIG_NFT_CT=y
CONFIG_NFT_NAT=y
CONFIG_NETFILTER_XT_CONNMARK=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_NAT=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
