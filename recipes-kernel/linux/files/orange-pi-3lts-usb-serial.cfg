# USB serial adapters (for example the CM5 UART in the cm5lab), built in so
# /dev/ttyUSB0 or /dev/ttyACM0 shows up as soon as one is plugged in:
# Pantavisor only loads modules that a container asks for through a driver
# alias, so a module would not appear on its own.
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_PL2303=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_CH341=y
CONFIG_USB_ACM=y
