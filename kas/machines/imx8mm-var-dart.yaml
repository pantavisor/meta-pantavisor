# Every file needs to contain a header, that provides kas with information
# about the context of this file.
header:
  # The `version` entry in the header describes for which configuration
  # format version this file was created for. It is used by kas to figure
  # out if it is compatible with this file. The version is an integer that
  # is increased on every format change.
  version: 16
  includes:
    - kas/scarthgap-var.yaml

# The machine as it is written into the `local.conf` of bitbake.
machine: imx8mm-var-dart

local_conf_header:
 platform-imx8mm-var-dart: |
  # UBOOT_DTB_NAME names U-Boot's own tree, which kept the unversioned filename
  # when Variscite renamed the kernel DTBs per DART revision, so the recipe's
  # default no longer matches a deployed kernel DTB. The first "fdt" key in
  # run.json becomes .pv/pv-fdt.dtb, which every board then boots.
  PV_INITIAL_DTB = "imx8mm-var-dart-2.x-dt8mcustomboard.dtb"
