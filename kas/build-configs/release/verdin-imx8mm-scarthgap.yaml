local_conf_header:
    platform-freescale: |
        ACCEPT_FSL_EULA = "1"
    platform-toradex: |
        PV_UBOOT_AUTOFDT = "1"
    toradex-kernel-premirror: |
        # A full clone of the kernel.org stable tree (linux-toradex-upstream) crawls
        # at ~10 KiB/s and dies mid-transfer. Toradex's toradex-mirrors.bbclass
        # (meta-toradex-distro, not used here) serves a git2 tarball of it; only that
        # one repo is redirected. "7" is TDX_MAJOR for the scarthgap-7.x.y branches.
        PREMIRRORS:prepend = "git://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git https://artifacts.toradex.com/artifactory/tdxref-torizoncore-sources-frankfurt/7/ "
    tezi-recovery-multiconfig: "BBMULTICONFIG:append = \" tezi-recovery\"\n# meta-toradex-tezi\
        \ recipes outside recipes-bsp/ require DISTRO = \"tezi\" to\n# parse cleanly\
        \ (TDX_VERSION undefined, tezirunimg IMAGE_CMD missing, Qt/Wayland\n# version\
        \ pins incompatible with panta-distro). Mask them globally; the only\n# tezi\
        \ artifacts we need are the u-boot and imx-boot bbappends in recipes-bsp/.\n\
        # meta-toradex-bsp-common ships its own u-boot-distro-boot.bb which conflicts\n\
        # with the tezi-specific 1.1 version \u2014 mask that too.\nBBMASK:append\
        \ = \" \\\n    meta-toradex-tezi/recipes-tezi/ \\\n    meta-toradex-tezi/recipes-graphics/\
        \ \\\n    meta-toradex-tezi/recipes-qt/ \\\n    meta-toradex-tezi/recipes-connectivity/\
        \ \\\n    meta-toradex-tezi/recipes-core/ \\\n    meta-toradex-tezi/recipes-kernel/\
        \ \\\n    meta-toradex-tezi/recipes-devtools/ \\\n    meta-toradex-tezi/recipes-support/\
        \ \\\n    \"\n"
    platform-verdin-imx8mm: |
        UBOOT_DTB_NAME = "imx8mm-verdin-wifi-dev.dtb"

        # Alternative device trees based on carrier board
        # UBOOT_DTB_NAME = "imx8mm-verdin-wifi-dev.dtb"    # Development board
        # UBOOT_DTB_NAME = "imx8mm-verdin-wifi-ivy.dtb"     # Ivy board
        # UBOOT_DTB_NAME = "imx8mm-verdin-wifi-mallow.dtb"  # Mallow board
        # UBOOT_DTB_NAME = "imx8mm-verdin-wifi-yavia.dtb"   # Yavia board

        # WiFi variant configuration
        TORADEX_VARIANT = "wifi"

        # Enable WiFi features
        MACHINE_FEATURES:append = " wifi"

        # Ensure WiFi firmware is included
        MACHINE_FIRMWARE:append = " linux-firmware-sd8997"

        # WiFi kernel modules to autoload
        KERNEL_MODULE_AUTOLOAD:append = " cfg80211 mwifiex_sdio"

        # Zinnia DTBs are listed in meta-toradex-nxp machine conf but absent from the
        # linux-toradex 6.6 NXP BSP kernel source; machine conf only removes them for mainline BSP.
        KERNEL_DEVICETREE:remove = "freescale/imx8mm-verdin-nonwifi-zinnia.dtb freescale/imx8mm-verdin-wifi-zinnia.dtb"

        # Required: pantavisor-default-skel adds a dm-crypt-caam disk for mx8m-generic-bsp;
        # caam-nxp installs keyctl-caam (caam-keygen) in the initramfs to mount it.
        PANTAVISOR_FEATURES:append = " caam-nxp"

        # Exclude problematic firmware package that causes license manifest issues
        PACKAGE_EXCLUDE:append = " firmware-nxp-wifi-bcm4359-pcie"

        # Disable SPDX generation to avoid license manifest issues with linux-firmware
        INHERIT:remove = "create-spdx"

        # Additional WiFi-specific settings
        # PV_INITIAL_DTB = "imx8mm-verdin-wifi-dev.dtb"

        # Disable auto FDT selection to use PV_INITIAL_DTB
        # This prevents the first DTB from KERNEL_DEVICETREE from being selected
        PV_UBOOT_AUTOFDT = "1"

        # Required when meta-toradex-tezi is in BBLAYERS: its u-boot-toradex bbappend
        # derives the recovery defconfig name from this variable. Without it the
        # do_configure:prepend shell task fails trying to copy "_defconfig".
        UBOOT_CONFIG_BASENAME:verdin-imx8mm = "verdin-imx8mm"

        # pv-flash bundle: recovery U-Boot source for factory flashing via UUU.
        PV_FLASH_RECOVERY_MC = "tezi-recovery"
        PV_FLASH_RECOVERY_RECIPE = "u-boot-toradex"
        PV_FLASH_RECOVERY_IMAGE = "imx-boot-recoverytezi"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.26.10"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
