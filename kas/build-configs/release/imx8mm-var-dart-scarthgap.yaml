local_conf_header:
    platform-freescale: |
        ACCEPT_FSL_EULA = "1"
    scarthgap-variscite: |
        BB_DANGLINGAPPENDS_WARNONLY = "1"
        PANTAVISOR_FEATURES:append = " caam-nxp"
        PV_UBOOT_AUTOFDT = "1"
    platform-imx8mm-var-dart: |
        # UBOOT_DTB_NAME names U-Boot's own tree, which kept the unversioned filename
        # when Variscite renamed the kernel DTBs per DART revision, so the recipe's
        # default no longer matches a deployed kernel DTB. The first "fdt" key in
        # run.json becomes .pv/pv-fdt.dtb, which every board then boots.
        PV_INITIAL_DTB = "imx8mm-var-dart-2.x-dt8mcustomboard.dtb"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.26.10"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
machine: imx8mm-var-dart
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
- pv-flash-bundle
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
