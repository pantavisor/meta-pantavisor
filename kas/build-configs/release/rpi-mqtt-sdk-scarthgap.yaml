header:
    version: 14
_source_dir: .
repos:
    meta-raspberrypi:
        commit: 018d44467c4f09eb63f8ea5e86e85d755250cf89
        patches:
            uboot-env:
                path: patches/meta-raspberrypi/0001-fix-conflicting-boot.scr-from-of-u-boot-and-u-boot-d.patch
                repo: meta-pantavisor
        path: layers/meta-raspberrypi
        url: https://github.com/agherzan/meta-raspberrypi
    meta-qt5:
        commit: 916d37e38077850ff5a0ac4fce6f2a55ba5b2a86
        path: layers/meta-qt5
        url: https://github.com/meta-qt5/meta-qt5/
    poky:
        patches:
            fit-image-multiconfig:
                path: patches/poky/0001-fit-image-multiconfig.scarthgap.patch
                repo: meta-pantavisor
            update-rc-initscripts:
                path: patches/poky/update-rc.patch
                repo: meta-pantavisor
        url: https://github.com/yoctoproject/poky.git
        path: layers/poky
        layers:
            meta:
            meta-poky:
        commit: 4fb7016a07507683359ebd620f1951fd5ea44bfa
    meta-pantavisor:
    meta-virtualization:
        commit: c141b3cd60ad3a1bbab22b4884742d4c082beda6
        path: layers/meta-virtualization
        url: https://git.yoctoproject.org/meta-virtualization
    meta-openembedded:
        commit: 0f00f8b9a21950640da8c5707343e5540133f86e
        layers:
            meta-filesystems:
            meta-networking:
            meta-oe:
            meta-python:
        path: layers/meta-openembedded
        url: https://github.com/openembedded/meta-openembedded.git
local_conf_header:
    platform-raspberrypi: |
        LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
        RPI_USE_U_BOOT = "1"
        ENABLE_UART = "1"
        PANTAVISOR_MACHINE_FIRMWARE = "linux-firmware-rpidistro-bcm43430 linux-firmware-rpidistro-bcm43455 linux-firmware-rpidistro-bcm43456 linux-firmware-rpidistro-bcm43436 linux-firmware-rpidistro-bcm43436s bluez-firmware-rpidistro-bcm4345c0-hcd bluez-firmware-rpidistro-bcm4345c5-hcd"
    multi: |
        BBMULTICONFIG = "rpi-kernel rpi-kernel7 rpi-kernel7l rpi-kernel8 rpi-kernel_2712"
    rpi-tryboot-system: |
        PANTAVISOR_FEATURES:append = " rpi-tryboot"
    rpi-pagesize-compat: |
        # RPi 5 kernel (kernel_2712) uses 16K page size. Align all ELF segments
        # to 64K so the same initramfs binaries work on 4K, 16K and 64K kernels.
        TARGET_LDFLAGS:append = " -Wl,-z,max-page-size=65536"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.24.13"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
    mqtt-sdk: |
        PANTAVISOR_CONFIG[PV_CONTROL_REMOTE]  = "0"
        PANTAVISOR_CONFIG[PV_LOG_PUSH]        = "0"
        PVROOT_CONTAINERS_CORE = "pv-pvr-sdk pv-alpine-connman pvwificonnect pv-avahi pv-avahi-browse pv-mqtt-sdk"
machine: raspberrypi
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
