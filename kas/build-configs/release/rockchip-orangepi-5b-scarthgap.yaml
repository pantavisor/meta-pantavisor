header:
    version: 16
_source_dir: .
repos:
    meta-rockchip:
        commit: 0d2f157767af62c43acca2f82b8d51cb99aa257a
        path: layers/meta-rockchip
        url: https://github.com/JeffyCN/meta-rockchip
    meta-arm:
        commit: 0a4b911d9fd63ab29c4532a907fae3282dbdcfe4
        layers:
            meta-arm:
            meta-arm-toolchain:
        path: layers/meta-arm
        url: https://git.yoctoproject.org/meta-arm
    poky:
        patches:
            fit-image-multiconfig:
                path: patches/poky/0001-fit-image-multiconfig.scarthgap.patch
                repo: meta-pantavisor
            update-rc-initscripts:
                path: patches/poky/update-rc.patch
                repo: meta-pantavisor
        url: https://github.com/yoctoproject/poky.git
        path: layers/poky
        layers:
            meta:
            meta-poky:
        commit: 77d1feb37e280733684ae8a9449fb031d5d7ff40
    meta-pantavisor:
    meta-virtualization:
        commit: f980aefbc8b3eeafb8d144e7fdac3c3b701a4fea
        path: layers/meta-virtualization
        url: https://git.yoctoproject.org/meta-virtualization
    meta-openembedded:
        commit: b5874ea07d69919d9b40d59f2c2f0bbd24bc3259
        layers:
            meta-filesystems:
            meta-networking:
            meta-oe:
            meta-python:
        path: layers/meta-openembedded
        url: https://github.com/openembedded/meta-openembedded.git
bblayers_conf_header:
    platform-rockchip: |
        # Scoped to this platform: the radxa fork (kas/platforms/radxa.yaml) also
        # registers the "rockchip" collection but has no u-boot-rockchip /
        # linux-rockchip recipes for these bbappends to extend.
        BBFILES_DYNAMIC += " rockchip:${META_PANTAVISOR_BASE}/dynamic-layers/meta-rockchip/recipes-*/*/*.bbappend"
local_conf_header:
    platform-rockchip: |
        PV_UBOOT_AUTOFDT = "1"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.24.13"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
machine: orangepi-5b
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
- pv-flash-bundle
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
