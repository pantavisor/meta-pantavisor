header:
    version: 16
_source_dir: .
repos:
    meta-freescale:
        commit: 114dda1a7639cac34e4e63c352e433d2d011a39c
        path: layers/meta-freescale
        url: https://github.com/Freescale/meta-freescale.git
    meta-freescale-3rdparty:
        commit: ce10c065119c2d4e359235c77aae7e0d843533ef
        path: layers/meta-freescale-3rdparty
        url: https://github.com/Freescale/meta-freescale-3rdparty.git
    meta-freescale-distro:
        commit: 2642b34e4c66ec1419e7f3a7a77a20b09e49e26b
        path: layers/meta-freescale-distro
        url: https://github.com/Freescale/meta-freescale-distro.git
    meta-openembedded:
        layers:
            meta-multimedia:
            meta-filesystems:
            meta-networking:
            meta-oe:
            meta-python:
        url: https://github.com/openembedded/meta-openembedded.git
        path: layers/meta-openembedded
        commit: 0f00f8b9a21950640da8c5707343e5540133f86e
    meta-imx:
        url: https://github.com/nxp-imx/meta-imx.git
        path: layers/meta-imx
        patches:
            qa-issue-fix:
                path: patches/meta-imx/0001-firmware-nxp-wifi-Fix-QA-issue.patch
                repo: meta-pantavisor
        branch: scarthgap-6.6.52-2.2.0
        layers:
            meta-imx-bsp:
            meta-imx-ml:
            meta-imx-sdk:
        commit: a0cf309d2e2d544111e520f572db8dff335eca01
    meta-arm:
        commit: 0a4b911d9fd63ab29c4532a907fae3282dbdcfe4
        layers:
            meta-arm:
            meta-arm-toolchain:
        path: layers/meta-arm
        url: https://git.yoctoproject.org/meta-arm
    poky:
        patches:
            fit-image-multiconfig:
                path: patches/poky/0001-fit-image-multiconfig.scarthgap.patch
                repo: meta-pantavisor
            update-rc-initscripts:
                path: patches/poky/update-rc.patch
                repo: meta-pantavisor
        url: https://github.com/yoctoproject/poky.git
        path: layers/poky
        layers:
            meta:
            meta-poky:
        commit: 4fb7016a07507683359ebd620f1951fd5ea44bfa
    meta-pantavisor:
    meta-virtualization:
        commit: c141b3cd60ad3a1bbab22b4884742d4c082beda6
        path: layers/meta-virtualization
        url: https://git.yoctoproject.org/meta-virtualization
local_conf_header:
    platform-freescale: |
        ACCEPT_FSL_EULA = "1"
    platform-nxp: |
        PV_UBOOT_AUTOFDT = "1"
        PV_UBOOT_FLATFDT = "1"
        VIRTUAL-RUNTIME_initscripts = "initscripts-pv"
        PREFERRED_RPROVIDER_initd-functions = "initscripts-pv"
        EXTRA_IMAGE_FEATURES = "debug-tweaks"
        PANTAVISOR_MACHINE_FIRMWARE = ""
        PANTAVISOR_MACHINE_KERNEL_MODULES = ""
        PREFERRED_PROVIDER_virtual/kernel = "linux-imx"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.24.13"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
bblayers_conf_header:
    platform-nxp: |
        BBMASK += "meta-imx/meta-bsp/recipes-bsp/firmware-imx/firmware-imx.*"
        BBMASK += "meta-imx/meta-imx-bsp/recipes-bsp/firmware-imx/firmware-imx.*"
        BBMASK += "meta-imx/meta-imx-bsp/recipes-connectivity/openssl"
machine: imx8qxp-b0-mek
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
- pv-flash-bundle
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
