local_conf_header:
    platform-freescale: |
        ACCEPT_FSL_EULA = "1"
    platform-toradex: |
        PV_UBOOT_AUTOFDT = "1"
    tezi-recovery-multiconfig: "BBMULTICONFIG:append = \" tezi-recovery\"\n# meta-toradex-tezi\
        \ recipes outside recipes-bsp/ require DISTRO = \"tezi\" to\n# parse cleanly\
        \ (TDX_VERSION undefined, tezirunimg IMAGE_CMD missing, Qt/Wayland\n# version\
        \ pins incompatible with panta-distro). Mask them globally; the only\n# tezi\
        \ artifacts we need are the u-boot and imx-boot bbappends in recipes-bsp/.\n\
        # meta-toradex-bsp-common ships its own u-boot-distro-boot.bb which conflicts\n\
        # with the tezi-specific 1.1 version \u2014 mask that too.\nBBMASK:append\
        \ = \" \\\n    meta-toradex-tezi/recipes-tezi/ \\\n    meta-toradex-tezi/recipes-graphics/\
        \ \\\n    meta-toradex-tezi/recipes-qt/ \\\n    meta-toradex-tezi/recipes-connectivity/\
        \ \\\n    meta-toradex-tezi/recipes-core/ \\\n    meta-toradex-tezi/recipes-kernel/\
        \ \\\n    meta-toradex-tezi/recipes-devtools/ \\\n    meta-toradex-tezi/recipes-support/\
        \ \\\n    \"\n"
    platform-colibri-imx6ull: "include conf/machine/include/colibri-imx6ull.inc\n\
        IMAGE_CLASSES:remove = \" image_type_tezi\"\nIMAGE_FSTYPES:remove = \"teziimg\"\
        \nIMAGE_FSTYPES:pn-pantavisor-starter:append = \" ubifs\"\nMKUBIFS_ARGS =\
        \ \"-m 2048 -e 126976 -c 4096\"\nPV_BOOT_OEMARGS = \"mtdparts=gpmi-nand:512k(mx6ull-bcb),1536k(u-boot1)ro,1536k(u-boot2)ro,512k(u-boot-env),-(ubi)\
        \ ubi.mtd=ubi pv_storage.device=ubi0:boot pv_storage.fstype=ubifs\"\n\n# WiFi/BT\
        \ (Colibri iMX6ULL WB): the default KERNEL_DEVICETREE order makes\n# PV_UBOOT_AUTOFDT\
        \ pick the non-WiFi imx6ull-colibri-aster.dtb, which never\n# enables usdhc2,\
        \ so the Marvell SD8997 SDIO chip is not probed (mwifiex_sdio\n# loads but\
        \ binds nothing, no wlan0). Pin the WiFi device tree for the Aster\n# carrier\
        \ and disable autofdt so it isn't overridden by the first DTB.\n# Other carriers:\
        \ imx6ull-colibri-wifi-{eval-v3,iris,iris-v2}.dtb\n# NB: use a :colibri-imx6ull\
        \ override to disable autofdt \u2014 a plain\n# PV_UBOOT_AUTOFDT = \"\" loses\
        \ to the platform-toradex \"1\" emitted later\n# in local.conf; the machine\
        \ override is applied at finalize and wins.\nPV_INITIAL_DTB = \"imx6ull-colibri-wifi-aster.dtb\"\
        \nPV_UBOOT_AUTOFDT:colibri-imx6ull = \"\"\nMACHINE_FEATURES:append = \" wifi\"\
        \n\n# 'dm-internal-secrets' uses the software 'dm-crypt-versatile' key type\n\
        # (pantavisor-default-skel device-disks.json) so it works on OPEN devices.\n\
        # Hardware-bound DCP needs a HAB-closed part: the mainline DCP trusted-key\n\
        # backend rejects the zeroed OTP key on open devices. To enable it on a\n\
        # secured device, set PANTAVISOR_FEATURES \"dcp\" (wires the DCP kernel\n\
        # backport patches + dcp.cfg + keyutils) and 'trusted.source=dcp' here,\n\
        # and switch the device-disks.json disk back to type dm-crypt-dcp.\nPV_MACHINE_UBOOT_CONFIGS:colibri-imx6ull\
        \ = \"file://pv.colibri-imx6ull.cfg\"\nUBOOT_CONFIG_BASENAME:colibri-imx6ull\
        \ = \"colibri-imx6ull\"\nPANTAVISOR_MACHINE_FIRMWARE:pn-empty-image = \"${MACHINE_FIRMWARE}\"\
        \nPV_FLASH_RECOVERY_MC = \"tezi-recovery\"\nPV_FLASH_RECOVERY_RECIPE = \"\
        u-boot-toradex\"\nPV_FLASH_RECOVERY_IMAGE = \"u-boot.imx-recoverytezi\"\n"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.24.13"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
machine: colibri-imx6ull
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
- mc:tezi-recovery:u-boot-toradex
- pv-flash-bundle
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
