header:
    version: 16
_source_dir: .
repos:
    meta-orangepi-i96:
        branch: feat/pantavisor-wic
        commit: e76a83c4a7c733b619b2610caf6ecb42ab02330f
        path: layers/meta-orangepi-i96
        url: https://github.com/pantavisor/meta-orangepi-i96
    poky:
        patches:
            fit-image-multiconfig:
                path: patches/poky/0001-fit-image-multiconfig.scarthgap.patch
                repo: meta-pantavisor
            update-rc-initscripts:
                path: patches/poky/update-rc.patch
                repo: meta-pantavisor
        url: https://github.com/yoctoproject/poky.git
        path: layers/poky
        layers:
            meta:
            meta-poky:
        commit: cbd62bb2a9f2ab3466a0f72f4289bc86ca20a019
    meta-pantavisor:
    meta-virtualization:
        commit: ee1ec1ee542389a3fc3692fdd232f9dd86c849a5
        path: layers/meta-virtualization
        url: https://git.yoctoproject.org/meta-virtualization
    meta-openembedded:
        commit: b5874ea07d69919d9b40d59f2c2f0bbd24bc3259
        layers:
            meta-filesystems:
            meta-networking:
            meta-oe:
            meta-python:
        path: layers/meta-openembedded
        url: https://github.com/openembedded/meta-openembedded.git
machine: orangepi-i96
local_conf_header:
    pv-flash-readme: |
        PV_FLASH_README = "docs/flashing/sdcard.md"
    platform-96boards: |
        # Boot through the generic pantavisor boot.scr: kernel, initrd and a
        # flat-named dtb (matching u-boot's ${fdtfile}) out of the BSP trail.
        PV_UBOOT_AUTOFDT = "1"
        PV_UBOOT_FLATFDT = "1"
        # Flashable SD image: bootloader.rda + boot partition + pantavisor storage
        # (layout in meta-orangepi-i96 wic/orangepi-i96.wks)
        IMAGE_FSTYPES:append:pn-pantavisor-starter = " wic.gz wic.bmap"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.24.13"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
