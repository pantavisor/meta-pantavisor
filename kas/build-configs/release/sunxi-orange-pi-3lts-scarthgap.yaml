header:
    version: 16
_source_dir: .
repos:
    meta-sunxi:
        commit: 719c841f3b97ca3d15be11781219ab1285db3c54
        patches:
            wks-root-label:
                path: patches/meta-sunxi/0001-wks-root-label.patch
                repo: meta-pantavisor
        path: layers/meta-sunxi
        url: https://github.com/linux-sunxi/meta-sunxi
    meta-arm:
        commit: 0a4b911d9fd63ab29c4532a907fae3282dbdcfe4
        layers:
            meta-arm:
            meta-arm-toolchain:
        path: layers/meta-arm
        url: https://git.yoctoproject.org/meta-arm
    poky:
        patches:
            fit-image-multiconfig:
                path: patches/poky/0001-fit-image-multiconfig.scarthgap.patch
                repo: meta-pantavisor
            insane-ptest-scan-note:
                path: patches/poky/0002-insane-fix-ptest-scan-note-format.patch
                repo: meta-pantavisor
            update-rc-initscripts:
                path: patches/poky/update-rc.patch
                repo: meta-pantavisor
        url: https://github.com/yoctoproject/poky.git
        path: layers/poky
        layers:
            meta:
            meta-poky:
        commit: b6ae714a1d1bfae8384654a13da15996cac64712
    meta-pantavisor:
    meta-virtualization:
        commit: 6e8e75775f1c73c7d5e8ffa9b1eb6040f7d10819
        path: layers/meta-virtualization
        url: https://git.yoctoproject.org/meta-virtualization
    meta-openembedded:
        commit: 2db6aece32c7f8ebf6015b468e1b4e21de072e3b
        layers:
            meta-filesystems:
            meta-networking:
            meta-oe:
            meta-python:
        path: layers/meta-openembedded
        url: https://github.com/openembedded/meta-openembedded.git
local_conf_header:
    platform-sunxi: |
        PV_UBOOT_AUTOFDT = "1"
    pvgo: |
        PREFERRED_VERSION_pvgo-binary-native = "1.26.10"
    rm_work: |
        INHERIT += "rm_work"
    package_management: |
        PACKAGE_CLASSES = "package_rpm"
    panta-base: |
        TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}"
    pantavisor-system: |
        DISTRO_FEATURES:append = " pantavisor-system "
        PANTAVISOR_FEATURES:append = " dm-crypt"
        PANTAVISOR_FEATURES:append = " dm-verity"
        PANTAVISOR_FEATURES:append = " xconnect-dbus-systembus"
        PANTAVISOR_FEATURES:append = " autogrow"
        INITRAMFS_IMAGE = "pantavisor-initramfs"
    pantavisor-runc: |
        PANTAVISOR_FEATURES:append = " runc"
    pantavisor-tailscale: |
        PANTAVISOR_FEATURES:append = " tailscale"
    pantavisor-debug: |
        PANTAVISOR_FEATURES:append = " debug"
    lxc-deprecated: |
        PANTAVISOR_FEATURES:append = " lxc-deprecated"
    __menu_config_locals: ''
    __menu_config_vars: |-
        EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
        INHERIT += "rm_work"
machine: orange-pi-3lts
defaults:
    repos:
        branch: scarthgap
target:
- pantavisor-starter
build_system: oe
distro: panta-distro
env:
    PVROOT_IMAGE_BSP:
    PV_BOOT_OEMARGS:
