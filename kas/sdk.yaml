# Layered over a docker-* machine and bsp-base.yaml, so the SDK is built
# with the board distro (musl, board PANTAVISOR_FEATURES): a pantavisor
# compiled with it runs inside a board's initramfs.
header:
  version: 16

repos:
  meta-openembedded:
    layers:
      # libcamera, for packagegroup-pv-sdk-target
      meta-multimedia:
  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:
  meta-qt6:
    url: "https://code.qt.io/yocto/meta-qt6.git"
    path: layers/meta-qt6
    branch: "6.11"
  meta-security:
    url: "https://git.yoctoproject.org/meta-security"
    path: layers/meta-security
    layers:
      meta-tpm:

local_conf_header:
  # A separate TMPDIR: the docker machines' default build is the glibc
  # appengine distro, and the two libcs cannot share one. kas writes
  # local_conf_header entries sorted by key, so this one lands after
  # bsp-base.yaml's "panta-base" TMPDIR and wins; keep the key sorting later.
  pv-sdk: |
    TMPDIR = "${TOPDIR}/tmp-${DISTRO_CODENAME}-sdk"
    DISTRO_FEATURES:append = " tpm2"
    # Applications here are Wayland clients. x11 would pull an X server into
    # the SDK through weston's xwayland and OpenCV's GTK backend.
    DISTRO_FEATURES:remove = "x11"
    # meta-qt6 builds each module's test suite when DISTRO_FEATURES has ptest
    # (a poky default); that alone took about 3 hours of task time in an
    # armv8 SDK build, for tests the SDK never ships.
    QT_PTEST_ENABLED = "0"
    PACKAGECONFIG:append:pn-libcamera = " gst"
    # The cam app needs libevent_pthreads; this layer's libevent is built
    # without thread support to match what pantavisor links against.
    EXTRA_OEMESON:append:pn-libcamera = " -Dcam=disabled"
    # kmssink and hardware decoders for playback without a compositor; vpx is
    # the software video decoder that needs no "commercial" license flag.
    PACKAGECONFIG:append:pn-gstreamer1.0-plugins-bad = " kms v4l2codecs webrtc"
    PACKAGECONFIG:append:pn-gstreamer1.0-plugins-good = " vpx"
    # LVGL compiles its display backends into the library; fbdev on top of
    # the default drm covers boards without a DRM driver.
    PACKAGECONFIG:append:pn-lvgl = " fbdev"
