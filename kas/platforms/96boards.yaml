# 96Boards platform. The only machine here is the Orange Pi i96, whose BSP now
# lives in its own layer: github.com/pantavisor/meta-orangepi-i96.
#
# It used to come from 96boards/meta-96boards, which is abandoned — its machine
# conf targeted the vendor's Linux 3.10 tree and a 2012 u-boot, neither of which
# builds with a current toolchain, and it dragged in an orphan mesa bbappend that
# had to be BBMASK'd. meta-orangepi-i96 replaces it outright, so meta-96boards is
# no longer fetched at all.
header:
  version: 16

repos:
  meta-orangepi-i96:
    url: "https://github.com/pantavisor/meta-orangepi-i96"
    path: layers/meta-orangepi-i96
    branch: main

local_conf_header:
  platform-96boards: |
    # Boot through the generic pantavisor boot.scr: kernel, initrd and a
    # flat-named dtb (matching u-boot's ${fdtfile}) out of the BSP trail.
    PV_UBOOT_AUTOFDT = "1"
    PV_UBOOT_FLATFDT = "1"
    # Flashable SD image: bootloader.rda + boot partition + pantavisor storage
    # (layout in meta-orangepi-i96 wic/orangepi-i96.wks)
    IMAGE_FSTYPES:append:pn-pantavisor-starter = " wic.gz wic.bmap"
    # The i96 reaches Hub only over its slow SDIO WiFi (~120-230 KB/s up): give
    # a Hub request 30 min instead of 60 s, so a large object transfer is not
    # cut short.
    PANTAHUB_CONFIG[PH_LIBEVENT_HTTP_TIMEOUT] = "1800"
