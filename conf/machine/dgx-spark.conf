#@TYPE: Machine
#@NAME: NVIDIA DGX Spark
#@DESCRIPTION: NVIDIA GB10 (DGX Spark and its OEM variants). AMI UEFI firmware
#@DESCRIPTION: with ACPI, no device tree; boots systemd-boot and a UKI from NVMe.

# GB10's Cortex-X925/A725 are Armv9.2, but scarthgap has no tune for them;
# match genericarm64 so userspace runs on any Armv8 SBSA machine.
require conf/machine/include/arm/arch-armv8a.inc
DEFAULTTUNE = "armv8a-crc"

MACHINE_FEATURES = " \
	acpi \
	efi \
	pci \
	usbhost \
	vfat \
	wifi \
	bluetooth \
	screen \
	keyboard \
	rtc \
"

KERNEL_IMAGETYPE = "Image"
PREFERRED_PROVIDER_virtual/kernel = "linux-nvidia-dgx"

# Firmware boots systemd-boot, which boots the UKI; there is no U-Boot, but
# pvroot images still depend on virtual/bootloader:do_deploy.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-dummy"
EFI_PROVIDER = "systemd-boot"

# Each revision carries the UKI in its BSP; pantavisor copies it to
# EFI/Linux/pv-<rev>.efi and picks the entry through systemd-boot's EFI
# variables.
PV_BSP_UKI = "pv-linux.efi"
PANTAVISOR_CONFIG[PV_BOOTLOADER_TYPE] = "sdboot"

# What empty-image puts in the BSP's modules.squashfs and firmware.squashfs.
# The firmware default is the whole linux-firmware (~570 MB squashed); GB10
# needs only the MT7925 blobs and the GSP firmware.
PANTAVISOR_MACHINE_KERNEL_MODULES = " \
	kernel-modules \
	nvidia-open-kernel-modules \
"
PANTAVISOR_MACHINE_FIRMWARE = " \
	linux-firmware-mediatek \
	nvidia-gsp-firmware \
"
BAD_RECOMMENDATIONS:append:pn-empty-image = " linux-firmware"

# Modules load only when a container names their alias in PV_DRIVERS_REQUIRED.
# The GPU firmware and the MT7925 firmware live in firmware.squashfs, which is
# only mounted with /storage, so these cannot be built in. No nvidia-peermem:
# without MLNX OFED's peer-memory symbols it builds as an empty stub, and
# GPUDirect RDMA goes through DMA-BUF (nvidia + mlx5) instead.
PV_BSP_DRIVERS = '{"all": {"nvidia": ["nvidia", "nvidia-uvm", "nvidia-modeset", "nvidia-drm"], "wifi": ["mt7925e"], "bluetooth": ["btmtk", "btusb"]}}'

# What DGX OS puts on the GB10 cmdline. pcie_bus_safe clamps every device to
# the bus's lowest MPS; the blacklisted initcalls corrupt memory on GB10.
# kho=off keeps KHO scratch from failing ibv_reg_mr (NCCL/RoCE) on 7.0.
PV_UKI_CMDLINE_MACHINE = " \
	console=tty0 \
	pci=pcie_bus_safe \
	initcall_blacklist=tegra234_cbb_init,power_wrap_init \
	kho=off \
"

IMAGE_FSTYPES += "wic wic.bmap"
WKS_FILE = "pv-efi-sdboot.wks.in"
WKS_FILE_DEPENDS:append = " \
	pv-uki \
	systemd-boot \
"
IMAGE_BOOT_FILES = " \
	systemd-bootaa64.efi;EFI/BOOT/BOOTAA64.EFI \
	pv-loader.conf;loader/loader.conf \
	pv-linux.efi;EFI/Linux/pv-0.efi \
"
# pvroot-image adds these for U-Boot boards.
IMAGE_BOOT_FILES:remove = " \
	boot.scr \
	oemEnv.txt \
"
