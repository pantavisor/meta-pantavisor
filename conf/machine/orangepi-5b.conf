#@TYPE: Machine
#@NAME: Orange Pi 5B

# meta-rockchip ships no Orange Pi 5B machine, but its rk3588.inc is board
# agnostic (keyed on RK_SOC_FAMILY), so we only add the missing devicetree
# (here and in dynamic-layers/meta-rockchip/recipes-kernel/linux/).
require conf/machine/include/rk3588.inc
require conf/machine/include/pv-rockchip-image.inc

KERNEL_DEVICETREE = "rockchip/rk3588s-orangepi-5b.dtb"

UBOOT_MACHINE = "rk3588_defconfig"

RK_WIFIBT_RRECOMMENDS = " \
	rkwifibt-firmware-ap6275p-wifi \
	rkwifibt-firmware-ap6275-bt \
	brcm-tools \
"
