name: "schedule: pvtests"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build-docker-x86_64-scarthgap:
    uses: ./.github/workflows/buildkas-target.yaml
    with:
      configs: kas/build-configs/release/docker-x86_64-scarthgap.yaml:kas/build-configs/shared-vols.yaml
      machine_name: docker-x86_64-scarthgap
      build_target: pantavisor-appengine-distro
      output: pantavisor-appengine-distro-*.tar.gz
      sdk: 0
    secrets: inherit

  pvtests:
    needs: build-docker-x86_64-scarthgap
    name: "pvtest (${{ matrix.scope }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          # local tests never talk to the Hub, so one Hub is enough
          - scope: local
            hub: prod
          # nightly covers both Hubs, so a regression against either is caught
          - scope: remote
            hub: all
    uses: ./.github/workflows/call-pvtests.yaml
    with:
      test_path: ${{ matrix.scope }}
      parallel: "6"
      # nightly covers both assignment models, so a regression in either is caught
      model: all
      hub: ${{ matrix.hub }}
    secrets: inherit
