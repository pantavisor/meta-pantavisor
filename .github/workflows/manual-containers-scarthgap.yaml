name: "manual containers: scarthgap"

on:
  workflow_dispatch:
    inputs:
      machine:
        description: 'Target architecture'
        required: true
        type: choice
        options:
          - docker-armv6
          - docker-armv8
          - docker-x86_64
      container:
        description: 'Container to build ("all" = every container supporting the machine, in one kas run)'
        required: true
        default: all
        type: choice
        options:
          - all
          - pv-labutils
          - pv-avahi
          - pvwificonnect
          - pv-avahi-browse
          - pv-netbench
          - pv-alpine-connman
          - pv-alpine-dbus
          - pv-awconnect
          - pv-debian-nm
          - pv-pvr-sdk
          - pv-pvsm
          - pv-pvwificonnect
          - pv-tailscale
          - pv-mqtt-sdk

jobs:
  build:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/buildkas-containers.yaml
    with:
      machine: ${{ inputs.machine }}
      containers: ${{ inputs.container }}
    secrets: inherit
