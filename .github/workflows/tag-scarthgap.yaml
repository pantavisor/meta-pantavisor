name: "ontag: sync and release"

on:
  push:
    paths:
      - '**'
      - 'kas/build-configs/**'
      - '.github/workflows/tag-scarthgap.yaml'
      - '!.github/scripts/**'
      - '!.github/templates/**'
    tags:
      - 0*
      - '*-rc*'

jobs:
  sync:
    uses: ./.github/workflows/sync-pantavisor.yaml
    secrets: inherit

  # Blocks stable releases (0NN) whose tagged commit lacks a finalized
  # CHANGELOG/CHANGELOG-<MAJOR>.md. RC tags pass through instantly.
  changelog-gate:
    uses: ./.github/workflows/changelog-gate.yaml
    secrets: inherit

  release:
    needs: [sync, changelog-gate]
    uses: ./.github/workflows/release.yaml
    secrets: inherit
