name: "generate latest docs on docs/ changes"

# Publishes always-current "latest" docs: meta-pantavisor's own docs/ as of
# this ref, plus pantavisor and pvr docs pulled straight from THEIR master
# branches (unpinned — see build-docs-latest.yaml). This intentionally does
# not go through the SRCREV/PV pins in recipes-pv/pantavisor/pantavisor.inc
# and recipes-pv/pvr/pvr_<PV>.bb. Release docs use tag-docs-scarthgap.yaml
# instead, which builds via bitbake and does follow those pins.
on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
  workflow_dispatch:

jobs:
  build-docs:
    uses: ./.github/workflows/build-docs-latest.yaml
    with:
      ref: master
      artifact_name: docs-tarball-latest

  publish-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-tarball-latest
          path: docs-out

      - name: upload docs to S3 and update latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          AWS_S3_URL="https://pantavisor-ci.s3.amazonaws.com/meta-pantavisor"

          ORIG_FILEPATH=$(ls docs-out/*.rootfs.docs.tar.zst)
          ORIG_FILENAME=$(basename "${ORIG_FILEPATH}")
          NEW_FILENAME=$(echo "${ORIG_FILENAME}" \
            | sed 's/pantavisor-starter-/pantavisor-/' \
            | sed 's/\.rootfs\.docs\.tar\.zst$/.docs.tar.zst/')
          cp "${ORIG_FILEPATH}" "docs-out/${NEW_FILENAME}"

          DOCS_CSUM=$(sha256sum "docs-out/${NEW_FILENAME}" | cut -d' ' -f1)

          aws s3 cp "docs-out/${NEW_FILENAME}" "s3://${AWS_S3_BUCKET}/docs/latest/${NEW_FILENAME}"
          DOCS_S3_URL="${AWS_S3_URL}/docs/latest/${NEW_FILENAME}"

          jq -n \
            --arg docs_name "${NEW_FILENAME}" \
            --arg docs_sha "${DOCS_CSUM}" \
            --arg docs_url "${DOCS_S3_URL}" \
            --arg branch "master" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            name: $docs_name,
            hash: $docs_sha,
            url: $docs_url,
            branch: $branch,
            generated: $timestamp
          }' > latest.json

          aws s3 cp latest.json "s3://${AWS_S3_BUCKET}/docs/latest.json"
