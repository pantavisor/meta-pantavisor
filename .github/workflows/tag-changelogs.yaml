name: "ontag: generate changelog and release notes"

# Runs after the tag build (tag-scarthgap.yaml) completes. Reads the just-
# updated releases.json from S3, runs make-changelog.sh in historical mode to
# render the section for the tag, then:
#   1. Merges the section into the per-major S3 accumulator
#      (s3://$AWS_S3_BUCKET/changelog/CHANGELOG-<MAJOR>.md), the rolling
#      cross-RC changelog document. RC sections stop here — they are never
#      committed to master.
#   2. Creates (or updates) the GitHub Release for the tag with the section
#      as its body.
#   3. For a stable tag only, commits the rendered CHANGELOG/CHANGELOG-<MAJOR>.md
#      to master. A stable release is cut on a branch off the validated RC tag,
#      so the `--finalize` commit never reaches master on its own; and by this
#      point releases.json has the stable artifacts, so the committed file gets
#      real download hashes instead of the tag's predicted URLs.
#
# The build artifacts are not attached to GitHub Releases — they live on S3
# and the changelog Downloads table links to them.
#
# Manual re-run via workflow_dispatch is supported for cases where S3 wasn't
# yet populated when the workflow first fired.

on:
  workflow_run:
    workflows: ["ontag: sync and release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to generate changelog for (e.g. 028-rc8)"
        required: true

jobs:
  changelog:
    name: "changelog (${{ github.event.inputs.tag || github.event.workflow_run.head_branch }})"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.workflow_run.head_branch, '0')
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Validate tag and derive major
        run: |
          if [[ ! "$TAG" =~ ^0[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match release pattern (0NN or 0NN-rcN)."
            exit 1
          fi
          MAJOR="${TAG%%-*}"
          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "Tag:   $TAG"
          echo "Major: $MAJOR"

      - name: Checkout master with full history
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Seed base file from the S3 accumulator
        run: |
          # make-changelog.sh merges the tag's section into whatever
          # CHANGELOG/CHANGELOG-<MAJOR>.md already contains. Start from the
          # rolling S3 document so earlier RC sections (never committed to
          # master) are carried forward. A 404 means this is the first tag in
          # the major — the generator then creates the file from scratch.
          URL="https://pantavisor-ci.s3.amazonaws.com/meta-pantavisor/changelog/CHANGELOG-${MAJOR}.md"
          curl -sfL -o "CHANGELOG/CHANGELOG-${MAJOR}.md" "$URL" \
            && echo "seeded from $URL" \
            || echo "no S3 accumulator yet for ${MAJOR} — starting fresh"

      - name: Generate changelog file (historical mode)
        run: |
          # The tag exists by the time this fires, so make-changelog.sh runs
          # in historical mode: writes CHANGELOG/CHANGELOG-<MAJOR>.md with real
          # download hashes from releases.json and does not commit.
          ./.github/scripts/make-changelog.sh --no-commit "$TAG"

      - name: Publish the S3 accumulator
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp "CHANGELOG/CHANGELOG-${MAJOR}.md" \
            "s3://${AWS_S3_BUCKET}/changelog/CHANGELOG-${MAJOR}.md"

      - name: Render release-notes section to a file
        run: |
          ./.github/scripts/make-changelog.sh --stdout "$TAG" > /tmp/release-notes.md
          echo "----- release-notes.md (head) -----"
          head -20 /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes."
            # --draft=false re-publishes a release that GitHub flipped back
            # to draft after a tag re-push
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --notes-file /tmp/release-notes.md
          else
            echo "Release $TAG does not exist — creating with notes."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi

      # RC sections live only on the S3 accumulator and must never reach
      # master, so this is guarded to stable 0NN tags.
      - name: Commit the finalized changelog to master
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^0[0-9]+$ ]]; then
            echo "Tag '$TAG' is not a stable release tag — not committing."
            exit 0
          fi

          FILE="CHANGELOG/CHANGELOG-${MAJOR}.md"
          cp "$FILE" /tmp/changelog-final.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # master may have moved while the release was building. The generated
          # file is authoritative in full, so re-apply it onto a fresh master
          # rather than merging or rebasing.
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            mkdir -p CHANGELOG
            cp /tmp/changelog-final.md "$FILE"

            # Stage before comparing: on the first stable of a new major the
            # file is untracked, and git diff ignores untracked paths.
            git add -- "$FILE"
            if git diff --cached --quiet -- "$FILE"; then
              echo "$FILE on master is already up to date — nothing to commit."
              exit 0
            fi

            git commit -m "changelogs(${MAJOR}): finalize ${MAJOR} changelog"

            if git push origin HEAD:master; then
              echo "Pushed $FILE to master."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}."
          done

          # The accumulator and the GitHub Release are already published, so a
          # failure here must not red-X the release. Hand the maintainer the
          # recovery steps instead.
          echo "::warning::Could not push ${FILE} to master. Apply it by hand (see the job summary)."
          {
            echo "## Changelog not committed to master"
            echo ""
            echo "\`${FILE}\` was published to the S3 accumulator and the \`${TAG}\` release,"
            echo "but pushing it to \`master\` failed (branch protection, or master moved). Run:"
            echo ""
            echo '```sh'
            echo "git switch master && git pull"
            echo "curl -sfL -o ${FILE} \\"
            echo "  https://pantavisor-ci.s3.amazonaws.com/meta-pantavisor/changelog/CHANGELOG-${MAJOR}.md"
            echo "git add -- ${FILE}"
            echo "git commit -m 'changelogs(${MAJOR}): finalize ${MAJOR} changelog'"
            echo "git push origin master"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
