name: 'Build Pantavisor Starter Image'

on:
  workflow_call:
    inputs:
      machine_name:
        required: true
        type: string
      configs:
        required: true
        type: string
      build_target:
        required: false
        type: string
      output:
        required: false
        type: string

jobs:
  build:
    env:
     TMPDIR : "tmp-scarthgap"
    runs-on: ["bsp-builder"]
    container:
      image: ghcr.io/pantacor/kas/kas:next-v7
      volumes:
        - shared:/shared
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with:
          # a persisted GITHUB_TOKEN header would shadow the private-repo .netrc
          persist-credentials: false
      - name: Fetch tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --tags --force --depth=${{ inputs.fetch-depth || 1 }}
      - name: setup workspace
        run: |
         chown -R builder:builder $RUNNER_WORKSPACE
         chown -R builder:builder /__w
         mkdir -p /shared/sstate && chown builder:builder /shared/sstate && mkdir -p /shared/dldir && chown builder:builder /shared/dldir
         su - builder -c "cd $GITHUB_WORKSPACE && git fetch origin $GITHUB_SHA && git reset --hard $GITHUB_SHA && rm -rf build/ && git clean -f -f -d -x "
         git config --global --add safe.directory /__w/meta-pantavisor/meta-pantavisor

      # Private source repositories (pv-mqtt-sdk) are fetched over HTTPS with
      # a read-only token; kas copies NETRC_FILE into the build's HOME.
      - name: git credentials
        env:
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: |
          umask 077
          : > ~builder/.netrc
          if [ -n "$PRIVATE_REPOS_TOKEN" ]; then
            printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_REPOS_TOKEN" > ~builder/.netrc
          fi
          chown builder:builder ~builder/.netrc

      - name: build
        run: |
         BUILD_TARGET="${{ inputs.build_target }}"
         su - builder -c "cd $GITHUB_WORKSPACE && env && NETRC_FILE=\$HOME/.netrc kas build ${{ inputs.configs }} ${BUILD_TARGET:+--target $BUILD_TARGET}"
      # Organize file for upload.sh
      - name: copy files
        run: |
         chmod -R 777 $GITHUB_WORKSPACE

         BUILD_BASE_DIR=$(echo build/${{ env.TMPDIR }}/deploy/images/*)

         mkdir -p images
         for pattern in ${{ inputs.output }}; do
            find "${BUILD_BASE_DIR}" -maxdepth 1 -name "$pattern" -exec cp {} images \;
         done

         mkdir -p pvexports
         find "${BUILD_BASE_DIR}" -name "*pvrexport.tgz" -exec cp {} pvexports \; 2>/dev/null || true

         UNPACKED_DIR=$(find "${BUILD_BASE_DIR}" -maxdepth 1 -type d -name "pantavisor-appengine-distro-*" | head -1)
         if [ -d "$UNPACKED_DIR" ]; then
           mkdir -p pvtest-distro
           cp -r "${UNPACKED_DIR}/." ./pvtest-distro/
         fi

      - name: Archive pvtest distro (unpacked)
        uses: actions/upload-artifact@v7
        with:
          name: pvtest-distro-${{ inputs.machine_name }}
          path: pvtest-distro/
          if-no-files-found: ignore

      - name: Upload to S3
        run: |
          .github/scripts/upload.sh \
           ${{ secrets.AWS_ACCESS_KEY_ID }} \
           ${{ secrets.AWS_SECRET_ACCESS_KEY }} \
           ${{ secrets.AWS_S3_BUCKET }} \
           ${{ github.ref_name }} \
           ${{ inputs.machine_name }} \

      - name: remove git credentials
        if: always()
        run: rm -f ~builder/.netrc
