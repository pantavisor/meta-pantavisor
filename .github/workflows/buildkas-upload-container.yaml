name: 'Build and Upload Containers'

on:
  workflow_call:
    inputs:
      machine:
        required: true
        type: string
      configs:
        required: true
        type: string
      workflow:
        description: 'containers.json "workflows" entry selecting which containers to build'
        required: false
        type: string
        default: tag

jobs:
  build:
    env:
     TMPDIR : "tmp-scarthgap"
     MACHINE: ${{ inputs.machine }}
     WORKFLOW: ${{ inputs.workflow }}
    runs-on: ["bsp-builder"]
    container:
      image: ghcr.io/pantacor/kas/kas:next-v7
      volumes:
        - shared:/shared
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with:
          # a persisted GITHUB_TOKEN header would shadow the private-repo .netrc
          persist-credentials: false
      - name: Fetch tags
        run: |
          git config --global --add safe.directory '*'
          git fetch --tags --force --depth=1
      - name: setup workspace
        run: |
         chown -R builder:builder $RUNNER_WORKSPACE
         chown -R builder:builder /__w
         mkdir -p /shared/sstate && chown builder:builder /shared/sstate && mkdir -p /shared/dldir && chown builder:builder /shared/dldir
         su - builder -c "cd $GITHUB_WORKSPACE && git fetch origin $GITHUB_SHA && git reset --hard $GITHUB_SHA && rm -rf build/ && git clean -f -f -d -x "
         git config --global --add safe.directory /__w/meta-pantavisor/meta-pantavisor

      # All containers for this machine in one bitbake run; -k keeps one
      # broken recipe from blocking the rest, and the upload step below
      # still publishes whatever did build.
      # Private source repositories (pv-mqtt-sdk) are fetched over HTTPS with
      # a read-only token; kas copies NETRC_FILE into the build's HOME.
      - name: git credentials
        env:
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: |
          umask 077
          : > ~builder/.netrc
          if [ -n "$PRIVATE_REPOS_TOKEN" ]; then
            printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_REPOS_TOKEN" > ~builder/.netrc
          fi
          chown builder:builder ~builder/.netrc

      - name: build
        run: |
         TARGETS=$(.github/scripts/container-targets --workflow "$WORKFLOW" "$MACHINE")
         [ -n "$TARGETS" ] || { echo "::error::no $WORKFLOW containers list $MACHINE"; exit 1; }
         # --target must precede the config for kas to accept "-- -k".
         su - builder -c "cd $GITHUB_WORKSPACE && env && NETRC_FILE=\$HOME/.netrc kas build $TARGETS ${{ inputs.configs }} -- -k"

      - name: copy files
        if: always()
        run: |
         chmod -R 777 $GITHUB_WORKSPACE
         mkdir -p pvexports
         find build/${{ env.TMPDIR }}/deploy/images/ -maxdepth 2 -name "*.pvrexport.tgz" -exec cp {} pvexports \; || true

      - name: Upload to S3
        if: always()
        run: |
          echo "## Containers ($MACHINE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Container | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          rc=0
          branch=$(jq -r .yocto_branch .github/containers.json)
          for name in $(.github/scripts/container-targets --workflow "$WORKFLOW" --list name "$MACHINE"); do
            if .github/scripts/upload-container.sh \
                 ${{ secrets.AWS_ACCESS_KEY_ID }} \
                 ${{ secrets.AWS_SECRET_ACCESS_KEY }} \
                 ${{ secrets.AWS_S3_BUCKET }} \
                 ${{ github.ref_name }} \
                 "$name-$MACHINE-$branch" \
                 "$name" \
                 "$MACHINE"; then
              echo "| $name | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | ❌ |" >> $GITHUB_STEP_SUMMARY
              rc=1
            fi
          done
          exit $rc

      - name: remove git credentials
        if: always()
        run: rm -f ~builder/.netrc
