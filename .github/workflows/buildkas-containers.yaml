name: "build containers"

on:
  workflow_call:
    inputs:
      machine:
        required: true
        type: string
      containers:
        description: 'Space-separated container names, or "all" for every manual-listed one; those not supporting the machine are skipped'
        required: false
        type: string
        default: all

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_target: ${{ steps.lookup.outputs.build_target }}
      output: ${{ steps.lookup.outputs.output }}
    steps:
      - uses: actions/checkout@v6
      - id: lookup
        env:
          CONTAINERS: ${{ inputs.containers }}
          MACHINE: ${{ inputs.machine }}
        run: |
          if [ "$CONTAINERS" = all ]; then
            args=(--workflow manual)
          else
            args=(--container "$CONTAINERS")
          fi
          build_target=$(.github/scripts/container-targets "${args[@]}" --list build_target "$MACHINE" | xargs)
          output=$(.github/scripts/container-targets "${args[@]}" --list output "$MACHINE" | xargs)
          if [ -z "$build_target" ]; then
            echo "::error::none of '$CONTAINERS' supports machine $MACHINE"
            exit 1
          fi
          echo "building for $MACHINE: $build_target"
          echo "build_target=$build_target" >> $GITHUB_OUTPUT
          echo "output=$output" >> $GITHUB_OUTPUT

  build:
    needs: resolve
    uses: ./.github/workflows/buildkas-target.yaml
    with:
      configs: kas/build-configs/release/containers/${{ inputs.machine }}-scarthgap.yaml:kas/build-configs/shared-vols.yaml
      machine_name: containers-${{ inputs.machine }}-scarthgap
      build_target: ${{ needs.resolve.outputs.build_target }}
      output: ${{ needs.resolve.outputs.output }}
      keep_going: true
    secrets: inherit

  # buildkas-target hands back one combined artifact from the self-hosted
  # runner; re-publish it as one artifact per container, then drop the
  # combined one. Runs after a partial -k build too, so whatever built ships.
  split:
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      COMBINED: build-containers-${{ inputs.machine }}-scarthgap
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.COMBINED }}
          path: build

      - uses: actions/upload-artifact@v7
        with:
          name: pv-labutils-${{ inputs.machine }}-scarthgap
          path: build/pv-labutils.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-avahi-${{ inputs.machine }}-scarthgap
          path: build/pv-avahi.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pvwificonnect-${{ inputs.machine }}-scarthgap
          path: build/pvwificonnect.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-avahi-browse-${{ inputs.machine }}-scarthgap
          path: build/pv-avahi-browse.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-netbench-${{ inputs.machine }}-scarthgap
          path: build/pv-netbench.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-alpine-connman-${{ inputs.machine }}-scarthgap
          path: build/pv-alpine-connman.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-alpine-dbus-${{ inputs.machine }}-scarthgap
          path: build/pv-alpine-dbus.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-awconnect-${{ inputs.machine }}-scarthgap
          path: build/pv-awconnect.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-debian-nm-${{ inputs.machine }}-scarthgap
          path: build/pv-debian-nm.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-pvr-sdk-${{ inputs.machine }}-scarthgap
          path: build/pv-pvr-sdk.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-pvsm-${{ inputs.machine }}-scarthgap
          path: build/pv-pvsm.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-pvwificonnect-${{ inputs.machine }}-scarthgap
          path: build/pv-pvwificonnect.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-tailscale-${{ inputs.machine }}-scarthgap
          path: build/pv-tailscale.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pv-mqtt-sdk-${{ inputs.machine }}-scarthgap
          path: build/pv-mqtt-sdk.pvrexport.tgz
          compression-level: 0
          if-no-files-found: ignore

      - name: delete combined artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 --jq ".artifacts[] | select(.name == \"$COMBINED\") | .id")
          [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
