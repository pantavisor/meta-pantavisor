name: "onpush: check pantavisor docs on SRCREV bump"

on:
  push:
    branches:
      - master
    paths:
      - "recipes-pv/pantavisor/pantavisor.inc"

permissions:
  contents: read
  actions: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check for docs/ changes between old and new PANTAVISOR_SRCREV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          RECIPE="recipes-pv/pantavisor/pantavisor.inc"
          NEW_SRCREV=$(grep -oP 'PANTAVISOR_SRCREV = "\K[^"]+' "$RECIPE")

          OLD_SRCREV=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BEFORE_SHA" 2>/dev/null || true
            OLD_SRCREV=$(git show "$BEFORE_SHA:$RECIPE" 2>/dev/null | grep -oP 'PANTAVISOR_SRCREV = "\K[^"]+' || true)
          fi

          if [ -z "$OLD_SRCREV" ]; then
            echo "Could not resolve previous PANTAVISOR_SRCREV; triggering docs build to be safe."
            gh workflow run docs-scarthgap.yaml --repo "$GITHUB_REPOSITORY" --ref master
            exit 0
          fi

          if [ "$OLD_SRCREV" = "$NEW_SRCREV" ]; then
            echo "PANTAVISOR_SRCREV unchanged ($NEW_SRCREV); nothing to check."
            exit 0
          fi

          echo "PANTAVISOR_SRCREV: $OLD_SRCREV -> $NEW_SRCREV"

          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          git init -q
          git remote add origin https://github.com/pantavisor/pantavisor.git
          git fetch -q --depth=1 origin "$OLD_SRCREV" 2>/dev/null || true
          git fetch -q --depth=1 origin "$NEW_SRCREV" 2>/dev/null || true

          if git rev-parse "$OLD_SRCREV" >/dev/null 2>&1 && git rev-parse "$NEW_SRCREV" >/dev/null 2>&1; then
            CHANGED_DOCS=$(git diff --name-only "$OLD_SRCREV" "$NEW_SRCREV" -- docs/)
          else
            echo "Could not fetch both commits from pantavisor/pantavisor; triggering docs build to be safe."
            CHANGED_DOCS="unresolved"
          fi

          if [ -n "$CHANGED_DOCS" ]; then
            echo "docs/ changed in pantavisor between $OLD_SRCREV and $NEW_SRCREV:"
            echo "$CHANGED_DOCS"
            gh workflow run docs-scarthgap.yaml --repo "$GITHUB_REPOSITORY" --ref master
          else
            echo "No docs/ changes in pantavisor between $OLD_SRCREV and $NEW_SRCREV; skipping."
          fi
