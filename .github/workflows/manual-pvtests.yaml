name: "manual: start pvtests"

on:
  workflow_dispatch:
    inputs:

      commit:
        description: 'Specific commit SHA to build from; defaults to the dispatched branch/tag tip'
        required: false
        type: string

      test_path:
        description: 'Test path to run (e.g. "local/lifecycle"); leave empty to run all tests'
        required: false
        type: string

      parallel:
        description: 'Number of tests to run in parallel'
        required: false
        type: string
        default: "6"

      model:
        description: 'Assignment model ("all" runs both, one job each)'
        required: false
        type: choice
        options:
          - volatile
          - persistent
          - all
        default: "volatile"

jobs:

  build-docker-x86_64-scarthgap:
    uses: ./.github/workflows/buildkas-target.yaml
    with:
      configs: kas/build-configs/release/docker-x86_64-scarthgap.yaml:kas/build-configs/shared-vols.yaml
      machine_name: docker-x86_64-scarthgap
      build_target: pantavisor-appengine-distro
      output: pantavisor-appengine-distro-*.tar.gz
      sdk: 0
      ref: ${{ inputs.commit }}
    secrets: inherit

  start-pvtest:
    needs: build-docker-x86_64-scarthgap
    uses: ./.github/workflows/call-pvtests.yaml
    with:
      commit: ${{ inputs.commit }}
      test_path: ${{ inputs.test_path }}
      parallel: ${{ inputs.parallel }}
      model: ${{ inputs.model }}
    secrets: inherit
